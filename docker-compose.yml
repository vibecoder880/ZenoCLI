services:
  zeno:
    build: .
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - ${USERPROFILE}/.zenocli:/root/.zenocli
      - .:/workspace
    working_dir: /workspace
    command: ["--help"]
