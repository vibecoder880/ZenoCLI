services:
  zeno:
    build: .
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      # ~/.zenocli is the cross-platform data dir: use HOME (macOS/Linux) and
      # fall back to USERPROFILE (Windows). Empty string on Windows if unset.
      - ${HOME:-${USERPROFILE:-}}/.zenocli:/root/.zenocli
      - .:/workspace
    working_dir: /workspace
    command: ["--help"]
